<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Xunqian Liu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a192f'/%3E%3Ctext x='32' y='42' font-family='Menlo,monospace' font-size='28' font-weight='700' fill='%2364ffda' text-anchor='middle'%3EXL%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#0a192f; --panel:#112240; --accent:#64ffda; --text:#ccd6f6; --bold:#e6f1ff; --dim:#8892b0;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100svh;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
    background-image: radial-gradient(600px circle at 50% 0%, rgba(100,255,218,.06), transparent 60%); }
  .term { background:var(--panel); border:1px solid #233554; border-radius:10px; padding:44px 40px; max-width:560px; width:100%;
    box-shadow:0 24px 60px -30px rgba(0,0,0,.8); }
  .code { font-family:var(--mono); font-size:clamp(56px,12vw,88px); font-weight:800; color:var(--accent); line-height:1; }
  h1 { color:var(--bold); font-size:20px; margin:16px 0 8px; }
  p { color:var(--dim); font-size:15px; margin-bottom:28px; }
  .cmd { font-family:var(--mono); font-size:13px; color:var(--dim); background:#060f22; border:1px solid #233554;
    border-radius:6px; padding:12px 16px; text-align:left; margin-bottom:28px; }
  .cmd .p { color:var(--accent); }
  a.btn { font-family:var(--mono); font-size:14px; color:var(--accent); border:1px solid var(--accent);
    border-radius:5px; padding:12px 22px; text-decoration:none; display:inline-block; }
  a.btn:hover { background:rgba(100,255,218,.1); }
</style>
</head>
<body>
  <div class="term">
    <div class="code">404</div>
    <h1>Route not found</h1>
    <p>The page you're looking for doesn't exist — but the backend is fine, I checked.</p>
    <div class="cmd"><span class="p">$</span> curl -I /this-page<br>HTTP/1.1 404 Not Found<br><span class="p">$</span> cd / && ls<br>about · experience · projects · contact</div>
    <a class="btn" href="/">← Back to /</a>
  </div>
</body>
</html>
